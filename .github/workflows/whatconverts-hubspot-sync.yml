name: WhatConverts -> HubSpot lead sync

on:
  schedule:
    # Every 30 minutes, 11:00-23:30 UTC, Mon-Fri.
    # That is 07:00-19:30 Eastern in summer (EDT) and 06:00-18:30 in winter
    # (EST) -- cron does not follow daylight saving. The drift is harmless:
    # the sync reads a rolling 30-day window and is idempotent, so an extra or
    # missed run changes nothing.
    - cron: "0,30 11-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read only -- log intended writes without making them"
        type: boolean
        default: true
      lookback_days:
        description: "Days of WhatConverts history to re-read"
        default: "30"

concurrency:
  # Never let a slow run overlap the next tick and double-create records.
  group: whatconverts-hubspot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/whatconverts-hubspot/requirements.txt

      - run: pip install -r integrations/whatconverts-hubspot/requirements.txt

      - name: Run sync
        env:
          WC_TOKEN: ${{ secrets.WHATCONVERTS_TOKEN }}
          WC_SECRET: ${{ secrets.WHATCONVERTS_SECRET }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python integrations/whatconverts-hubspot/sync.py \
            --lookback-days "${{ inputs.lookback_days || '30' }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
