name: WhatConverts -> HubSpot lead sync

on:
  schedule:
    # Every 15 minutes, 11:00-23:52 UTC, Mon-Fri -- 07:00-19:52 Eastern in
    # summer (EDT), an hour earlier in winter, since cron does not follow
    # daylight saving. The drift is harmless: the sync reads a rolling 30-day
    # window and is idempotent, so an extra or missed run changes nothing.
    #
    # The odd minutes are deliberate. GitHub documents `schedule` as
    # best-effort -- delayed under load, and "if the load is sufficiently high,
    # some queued jobs may be dropped" -- and names the start of every hour as
    # a high-load window. This workflow previously asked for :00 and :30, the
    # two most congested minutes on the platform, and over 9 weekdays GitHub
    # delivered 35 of 234 slots, a median 3.2 hours apart.
    #
    # So this asks off-peak, and asks more often: if drops are load-driven and
    # roughly random, four times the slots should yield roughly four times the
    # runs. It is mitigation, not a fix. GitHub guarantees nothing here, which
    # is why the webhook relay in integrations/whatconverts-hubspot/relay/
    # exists -- this schedule is the safety net beneath it, not the clock a
    # sales callback depends on.
    - cron: "7,22,37,52 11-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read only -- log intended writes without making them"
        type: boolean
        default: true
      lookback_days:
        description: "Days of WhatConverts history to re-read"
        default: "30"

concurrency:
  # Never let a slow run overlap the next tick and double-create records.
  group: whatconverts-hubspot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/whatconverts-hubspot/requirements.txt

      - run: pip install -r integrations/whatconverts-hubspot/requirements.txt

      - name: Determine run mode
        id: mode
        # Scheduled runs are DRY BY DEFAULT. They only write once the repository
        # variable DRY_RUN is explicitly set to "false" (Settings -> Secrets and
        # variables -> Actions -> Variables). This means merging the workflow
        # cannot itself start writing to the production portal.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY: ${{ inputs.dry_run }}
          VAR_DRY: ${{ vars.DRY_RUN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            dry="$INPUT_DRY"
          elif [ "$VAR_DRY" = "false" ]; then
            dry=false
          else
            dry=true
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          if [ "$dry" = "true" ]; then
            echo "::notice::DRY RUN -- no records will be written to HubSpot."
          else
            echo "::warning::LIVE RUN -- writing to production HubSpot portal 48530303."
          fi

      - name: Run sync
        env:
          WC_TOKEN: ${{ secrets.WHATCONVERTS_TOKEN }}
          WC_SECRET: ${{ secrets.WHATCONVERTS_SECRET }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ steps.mode.outputs.dry }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
        run: |
          args=(--lookback-days "$LOOKBACK_DAYS")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          python integrations/whatconverts-hubspot/sync.py "${args[@]}"
